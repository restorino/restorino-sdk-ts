name: 🐛 Bug Report
description: Report a bug or unexpected behavior in @restorino/sdk
title: "[Bug]: "
labels: ["bug", "triage"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to report an issue! Please check if the bug was already reported before submitting.
  - type: input
    id: version
    attributes:
      label: SDK Version
      description: What version of `@restorino/sdk` are you using? (e.g. 0.0.1)
      placeholder: "0.0.1"
    validations:
      required: true
  - type: dropdown
    id: environment
    attributes:
      label: Runtime / Framework
      description: Which environment are you running the SDK in?
      options:
        - Next.js (App Router)
        - Next.js (Pages Router)
        - Vite / React
        - Lovable.dev
        - v0.dev / Bolt.new
        - Node.js
        - Other (specify below)
    validations:
      required: true
  - type: textarea
    id: description
    attributes:
      label: Describe the bug
      description: A clear and concise description of what the bug is.
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Steps to Reproduce & Code Snippet
      description: Please share minimal code to reproduce the issue.
      render: typescript
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected Behavior
      description: What did you expect to happen instead?
    validations:
      required: true
