name: SDK CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    name: Build, type-check, test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          # Pinned: Node 20 is EOL and unpatched for CVE-2026-111497 (Brotli).
          node-version: '24.22.1'
          cache: npm

      - run: npm ci

      - name: Type-check sources
        run: npm run typecheck

      - name: Type-check reference example
        run: npm run typecheck:examples

      - name: Unit, contract, security and docs tests
        run: npm test

      - name: No runtime dependency vulnerabilities
        run: npm audit --omit=dev

  contract-drift:
    name: Backend contract drift
    runs-on: ubuntu-latest
    # Opt-in: set the repository variable CONTRACT_OPENAPI_URL to the backend
    # spec URL (e.g. https://api.restorino.com/v3/api-docs).
    if: ${{ vars.CONTRACT_OPENAPI_URL != '' }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24.22.1'
          cache: npm

      - run: npm ci

      - name: Refresh snapshot from the live backend
        run: npm run contract:snapshot -- --url "${{ vars.CONTRACT_OPENAPI_URL }}"

      # A diff means the backend changed a DTO or route the SDK depends on.
      # Review it, update the SDK, then commit the refreshed snapshot.
      - name: Fail if the committed snapshot is stale
        run: git diff --exit-code contract/contract.snapshot.json
